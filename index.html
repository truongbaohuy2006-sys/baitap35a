<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form đăng ký tài khoản</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page-wrapper">
    <section class="form-card" aria-labelledby="formTitle">
      <h1 id="formTitle">Đăng ký tài khoản</h1>
      <p class="subtitle">Vui lòng nhập đầy đủ thông tin bên dưới để tạo tài khoản.</p>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="fullName">Họ và tên</label>
          <input
            type="text"
            id="fullName"
            name="fullName"
            placeholder="Ví dụ: Nguyễn Văn An"
            maxlength="80"
            autocomplete="name"
            required
          />
          <small class="error-msg" id="fullNameError" aria-live="polite"></small>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Ví dụ: an.nguyen@example.com"
            maxlength="120"
            autocomplete="email"
            required
          />
          <small class="error-msg" id="emailError" aria-live="polite"></small>
        </div>

        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <div class="password-box">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Ít nhất 8 ký tự, gồm chữ hoa, thường và số"
              maxlength="128"
              autocomplete="new-password"
              required
            />
            <button
              type="button"
              id="togglePasswordBtn"
              class="toggle-btn"
              aria-label="Hiện hoặc ẩn mật khẩu"
              aria-pressed="false"
            >
              Hiện
            </button>
          </div>
          <small class="error-msg" id="passwordError" aria-live="polite"></small>
        </div>

        <div class="form-group checkbox-group">
          <div class="checkbox-row">
            <input type="checkbox" id="agreeTerms" name="agreeTerms" required />
            <label for="agreeTerms">Tôi đồng ý với các điều khoản và chính sách sử dụng</label>
          </div>
          <small class="error-msg" id="termsError" aria-live="polite"></small>
        </div>

        <button type="submit" class="submit-btn">Đăng ký</button>
      </form>

      <div id="successBox" class="success-box" role="status" aria-live="polite" hidden></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
